name: nexus-erp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_erp}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_bootstrap}
      # Local development fallbacks only. A production deployment must set
      # distinct secrets; the API refuses to boot in production when its
      # DATABASE_URL still uses a *_dev_only password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bootstrap_dev_only}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-nexus_app_dev_only}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-nexus_migrator_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://nexus_app:${POSTGRES_APP_PASSWORD:-nexus_app_dev_only}@postgres:5432/${POSTGRES_DB:-nexus_erp}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-nexus.sid}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Production sessions must be Secure. The API fails fast when this is
      # false or when WEB_ORIGIN is not HTTPS while NODE_ENV=production.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nexus_postgres_data:
  nexus_redis_data:
